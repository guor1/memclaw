[package]
name = "oc-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "oc 常驻进程：协议服务端 + 事件广播 + 编排"

[dependencies]
oc-proto = { workspace = true }
oc-core  = { workspace = true }
oc-store = { workspace = true }
oc-llm   = { workspace = true }
oc-tools = { workspace = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
async-trait = "0.1"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }

[features]
# 测试 harness（`oc_server::testing`）。默认关闭，仅测试构建启用。
#
# 放在 src/ 而非 tests/ 是因为 Rust 里 tests/*.rs 各自是独立 crate，无法共享代码；
# 而 oc-http 的 e2e 也要起真 daemon，跨 crate 更只能走 feature。
test-support = ["dep:tempfile"]

[dependencies.tempfile]
version = "3"
optional = true

[dev-dependencies]
tempfile = "3"
# 自身的集成测试也要用 harness。
oc-server = { path = ".", features = ["test-support"] }
