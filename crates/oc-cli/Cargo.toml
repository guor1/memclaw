[package]
name = "oc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "oc CLI：命令树 + doctor + onboard"

[[bin]]
name = "oc"
path = "src/main.rs"

[dependencies]
oc-proto  = { workspace = true }
oc-core   = { workspace = true }
oc-store  = { workspace = true }
oc-server = { workspace = true }
oc-llm    = { workspace = true }
oc-tui    = { path = "../oc-tui" }
clap = { version = "4", features = ["derive"] }
directories = "5"
serde_json = "1"
toml = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fs2 = "0.4"
ratatui = "0.28"
crossterm = "0.28"

[features]
default = ["provider-openai", "provider-anthropic"]
provider-openai = ["oc-llm/openai"]
provider-anthropic = ["oc-llm/anthropic"]
