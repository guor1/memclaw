[package]
name = "oc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "oc CLI：命令树 + doctor + onboard"

[[bin]]
name = "oc"
path = "src/main.rs"

[dependencies]
oc-proto  = { workspace = true }
oc-core   = { workspace = true }
oc-store  = { workspace = true }
oc-server = { workspace = true }
oc-llm    = { workspace = true }
oc-tools  = { workspace = true }
oc-tui    = { path = "../oc-tui" }
clap = { version = "4", features = ["derive"] }
directories = "5"
serde_json = "1"
toml = "0.8"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
fs2 = "0.4"
ratatui = "0.28"
crossterm = "0.28"
tracing-appender = "0.2.5"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tracing = "0.1.44"
time-tz = { version = "2", features = ["system"] }

[features]
default = ["provider-openai", "provider-anthropic", "web-tools"]
provider-openai = ["oc-llm/openai"]
provider-anthropic = ["oc-llm/anthropic"]
# 联网工具（web_fetch/web_search）。
web-tools = ["oc-tools/web"]
